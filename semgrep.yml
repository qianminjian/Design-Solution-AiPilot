# semgrep 自定义规则 — 施工图全流程 AI 平台
#
# 权威源：
#   - .trae/rules/security.md（密钥管理、PII 分级、AI 安全红线）
#   - .trae/rules/coding-standards.md（禁止项：any/console.log/魔术数字）
#
# 用途：
#   1. 在内置规则集（p/typescript, p/java, p/python 等）之外补充项目特化规则
#   2. 强制安全红线（密钥不硬编码、密码不进日志、AI 输出标记）
#   3. 强制编码规范（禁止 any / console.log / 魔术数字）
#
# 使用方式：CI 中通过 `config: p/typescript semgrep.yml` 组合加载

rules:
  # ──────────────────────────────────────────────────────────────
  # 安全红线（security.md）
  # ──────────────────────────────────────────────────────────────

  - id: design-platform.no-hardcoded-jwt-secret
    languages: [typescript, javascript, python, java]
    severity: ERROR
    message: "JWT_SECRET 不允许硬编码，必须从环境变量读取（security.md §1）"
    patterns:
      - pattern-regex: 'JWT_SECRET\s*[:=]\s*[''"]([^''"]{8,})[''"]'
    fix: "JWT_SECRET 从环境变量读取：process.env.JWT_SECRET（TS）/ os.getenv('JWT_SECRET')（Python）"
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      source: security.md §1

  - id: design-platform.no-hardcoded-db-password
    languages: [typescript, javascript, python, java]
    severity: ERROR
    message: "DB_PASSWORD 不允许硬编码（security.md §1）"
    patterns:
      - pattern-regex: 'DB_PASSWORD\s*[:=]\s*[''"]([^''"]{8,})[''"]'
    metadata:
      category: security
      cwe: "CWE-798"
      source: security.md §1

  - id: design-platform.no-hardcoded-llm-api-key
    languages: [typescript, javascript, python, java]
    severity: ERROR
    message: "LLM_API_KEY 不允许硬编码（security.md §1）"
    patterns:
      - pattern-regex: 'LLM_API_KEY\s*[:=]\s*[''"]([A-Za-z0-9_\-]{32,})[''"]'
    metadata:
      category: security
      cwe: "CWE-798"
      source: security.md §1

  - id: design-platform.no-console-log-in-production
    languages: [typescript, javascript]
    severity: WARNING
    message: "禁止在生产代码中使用 console.log（coding-standards.md 禁止项）"
    pattern: console.log(...)
    paths:
      exclude:
        - "tests/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "scripts/**"
    metadata:
      category: code-quality
      source: coding-standards.md 禁止项

  - id: design-platform.no-any-type
    languages: [typescript]
    severity: WARNING
    message: "禁止使用 any 类型，使用 unknown + type guard（coding-standards.md）"
    patterns:
      - pattern: ": any"
      - pattern: "as any"
      - pattern: "@ts-ignore"
    paths:
      exclude:
        - "tests/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"
    metadata:
      category: code-quality
      source: coding-standards.md 禁止项

  - id: design-platform.no-empty-catch
    languages: [typescript, javascript, java]
    severity: WARNING
    message: "禁止空 catch 块，必须记录 + 处理（coding-standards.md 禁止项）"
    patterns:
      - pattern: |
          catch ($E) {}
    metadata:
      category: code-quality
      cwe: "CWE-390: Detection of Error Condition Without Action"
      source: coding-standards.md 禁止项

  - id: design-platform.no-dangerously-set-inner-html
    languages: [typescript, javascript]
    severity: ERROR
    message: "禁止使用 dangerouslySetInnerHTML（security.md §6.1 XSS 防护）"
    pattern-either:
      - pattern: dangerouslySetInnerHTML={}
      - pattern: "dangerouslySetInnerHTML={{ __html: $X }}"
    paths:
      exclude:
        - "tests/**"
        - "**/*.test.ts"
    metadata:
      category: security
      cwe: "CWE-79: XSS"
      source: security.md §6.1

  - id: design-platform.no-eval
    languages: [typescript, javascript]
    severity: ERROR
    message: "禁止使用 eval（security.md §6.1 XSS 防护）"
    pattern: eval(...)
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      source: security.md §6.1

  - id: design-platform.require-isAiAssisted-flag
    languages: [typescript]
    severity: WARNING
    message: "AI 响应 DTO 必须包含 isAiAssisted 标记（security.md §12 AI 安全红线）"
    patterns:
      - pattern-inside: |
          interface $NAME {
            ...
          }
      - pattern-either:
          - pattern-regex: 'isAiAssisted\s*:\s*boolean'
      - metavariable-regex:
          metavariable: $NAME
          regex: ".*Response$|.*Dto$"
    paths:
      include:
        - "packages/shared/src/contracts/**"
    metadata:
      category: security
      source: security.md §12

  # ──────────────────────────────────────────────────────────────
  # Python 特化规则（services/ai）
  # ──────────────────────────────────────────────────────────────

  - id: design-platform.python-no-hardcoded-secret
    languages: [python]
    severity: ERROR
    message: "Python 源码不允许硬编码密钥（security.md §1）"
    patterns:
      - pattern-regex: '(api_key|secret|password|token)\s*=\s*[''"]([^''"]{16,})[''"]'
    paths:
      exclude:
        - "tests/**"
        - "**/test_*.py"
        - "**/*_test.py"
    metadata:
      category: security
      cwe: "CWE-798"
      source: security.md §1

  - id: design-platform.python-no-bare-except
    languages: [python]
    severity: WARNING
    message: "禁止裸 except，必须捕获具体异常（coding-standards.md）"
    pattern: "except:"
    metadata:
      category: code-quality
      source: coding-standards.md

  # ──────────────────────────────────────────────────────────────
  # Java 特化规则（services/core）
  # ──────────────────────────────────────────────────────────────

  - id: design-platform.java-no-print-stack-trace
    languages: [java]
    severity: WARNING
    message: "禁止 e.printStackTrace()，使用 logger 记录（coding-standards.md 禁止项）"
    pattern: $E.printStackTrace()
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.java"
        - "**/*IT.java"
    metadata:
      category: code-quality
      source: coding-standards.md 禁止项

  - id: design-platform.java-no-system-out-println
    languages: [java]
    severity: WARNING
    message: "禁止 System.out.println，使用 logger（coding-standards.md 禁止项）"
    pattern: System.out.println(...)
    paths:
      exclude:
        - "**/test/**"
        - "**/*Test.java"
    metadata:
      category: code-quality
      source: coding-standards.md 禁止项

# CI 流水线 — 施工图全流程 AI 平台
#
# 设计目标：按语言/服务并行化执行，PR 失败即阻断合并。
# 触发：push 到 main、对 main 的 pull_request、手动 dispatch。
#
# Job 拓扑（全部并行）：
#   1. node-workspace  — pnpm 9 + Node 20，typecheck / lint / vitest 单测（覆盖率门禁 ≥ 80%）
#   2. java-core       — Java 21 + Maven，单元/集成测试（JaCoCo 覆盖率 ≥ 80%）
#   3. python-ai       — Python 3.12 + Ruff lint + pytest（覆盖率门禁 ≥ 80%）
#   4. build-workspace — pnpm build（验证可构建）+ apps/web/bff 产物
#
# 权威源：
# - .trae/rules/testing.md（覆盖率基线、Mock 规范、CI 门禁）
# - .trae/rules/coding-standards.md（TypeScript/Java/Python 风格）
# - .trae/rules/security.md（CI 安全门禁、密钥管理）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支后续 push 取消旧 run，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：仅读仓库 + 必要的 PR 评论权限
permissions:
  contents: read
  pull-requests: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 0: 测试质量门禁（LLM Mock 扫描 + Skip 扫描）
  # 在所有测试运行前先扫描测试文件，阻断违规
  # ──────────────────────────────────────────────────────────────
  test-quality-gate:
    name: 测试质量门禁（LLM Mock + Skip 扫描）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: LLM Mock 扫描（禁止真实付费 API 调用）
        # 对齐 testing.md §4.2 LLM 调用 Mock 红线
        # 检测测试文件中 api.openai.com / api.anthropic.com 等真实付费 API URL
        run: python3 scripts/scan-llm-mock.py

      - name: Skip 扫描（禁止无注释的 .skip / @Disabled）
        # 对齐 testing.md §9.2 跳过测试扫描
        # 检测 .skip / @Disabled / pytest.skip 必须附带 issue 编号与原因注释
        run: python3 scripts/scan-skip-tests.py

  # ──────────────────────────────────────────────────────────────
  # Job 1: TypeScript workspace（BFF + Web + packages/shared）
  # typecheck → lint → vitest 单测（覆盖率门禁）
  # ──────────────────────────────────────────────────────────────
  node-workspace:
    name: TypeScript workspace（lint + typecheck + test）
    runs-on: ubuntu-latest
    needs: [test-quality-gate]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 pnpm 9
        uses: pnpm/action-setup@v4
        with:
          # 锁定版本与 packageManager 字段一致
          version: 9.15.0
          run_install: false

      - name: 配置 Node 20（启用 pnpm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 安装依赖（frozen-lockfile，禁止修改锁文件）
        run: pnpm install --frozen-lockfile

      - name: 类型检查（pnpm -r typecheck）
        # 触发 apps/web、apps/bff、packages/shared 的 typecheck 脚本
        run: pnpm -r typecheck

      - name: Lint 检查（pnpm -r lint）
        # ESLint（apps/bff/web）+ Next.js lint
        # turbo.json 中 lint 依赖 ^build，但 typecheck 已确保类型正确
        run: pnpm -r lint

      - name: 单元测试（pnpm -r test，含覆盖率门禁）
        # apps/bff 使用 vitest run（非 watch），见 apps/bff/package.json test 脚本
        # 覆盖率门禁见 apps/bff/vitest.config.ts（行 ≥80% / 分支 ≥70%）
        # apps/web 无 test 脚本（E2E 单独工作流）
        run: pnpm -r test

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 2: Java 核心服务（Spring Boot 3.4 + JDK 21）
  # Checkstyle + Maven test（JaCoCo 覆盖率 ≥ 80%）
  # ──────────────────────────────────────────────────────────────
  java-core:
    name: Java 核心服务（Maven test + JaCoCo）
    runs-on: ubuntu-latest
    needs: [test-quality-gate]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 缓存 Maven 仓库
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          # pom.xml 变更时自动失效
          key: maven-${{ runner.os }}-${{ hashFiles('services/core/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: 构建并测试（mvn verify，含集成测试 + JaCoCo 覆盖率）
        # CI 中使用系统 mvn（避免本地 mvnw 兼容问题）
        # ubuntu-latest 自带 docker daemon，TestContainers 会自动拉取 postgres:16-alpine
        # 集成测试基类：services/core/src/test/java/com/platform/core/testsupport/AbstractIntegrationTest.java
        working-directory: services/core
        run: mvn -B -ntp verify

      - name: 校验 JaCoCo 覆盖率门禁（≥ 80%）
        # Maven JaCoCo 插件在 verify 阶段生成 jacoco.exec，
        # 此步通过 fail-on-violation 阻断覆盖率不达标
        working-directory: services/core
        run: mvn -B -ntp jacoco:check

      - name: 上传 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-java
          path: services/core/target/site/jacoco/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 3: Python AI 服务（FastAPI + Ruff + pytest）
  # ──────────────────────────────────────────────────────────────
  python-ai:
    name: Python AI 服务（Ruff + pytest）
    runs-on: ubuntu-latest
    needs: [test-quality-gate]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('services/ai/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 安装依赖（含 dev extras：pytest / pytest-asyncio / httpx / ruff）
        # editable 安装保证 src.main 等导入路径可解析
        run: pip install -e "services/ai[dev]" ruff

      - name: Ruff Lint 检查
        # Ruff 替代 flake8/isort/black，单一工具统一代码风格
        working-directory: services/ai
        run: ruff check src/ tests/

      - name: Ruff 格式检查
        working-directory: services/ai
        run: ruff format --check src/ tests/

      - name: 运行 pytest（含覆盖率门禁 ≥ 80%）
        working-directory: services/ai
        # 测试目录：services/ai/tests（见 pyproject.toml testpaths）
        # asyncio_mode=auto 已在 pyproject.toml 配置，无需 CLI flag
        # 覆盖率门禁：--cov-fail-under=80
        run: python -m pytest tests/ -v --cov=src --cov-fail-under=80 --cov-report=xml --cov-report=html --cov-report=term

      - name: 上传 pytest 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: services/ai/htmlcov/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job 4: 构建产物（TypeScript workspace build）
  # 验证 Next.js + NestJS 可成功构建（依赖 ^build 链路）
  # ──────────────────────────────────────────────────────────────
  build-workspace:
    name: Build（Next.js + NestJS）
    runs-on: ubuntu-latest
    needs: [node-workspace, test-quality-gate]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: 配置 Node 20（启用 pnpm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 安装依赖（frozen-lockfile）
        run: pnpm install --frozen-lockfile

      - name: 构建 packages/shared（被 web/bff 依赖）
        run: pnpm --filter @design-platform/shared build

      - name: 构建 apps/bff（NestJS）
        run: pnpm --filter @design-platform/bff build

      - name: 构建 apps/web（Next.js）
        run: pnpm --filter @design-platform/web build

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/bff/dist
            apps/web/.next
          retention-days: 3
          if-no-files-found: warn

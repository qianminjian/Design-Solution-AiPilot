# CI 流水线 — 施工图全流程 AI 平台
#
# 设计目标：按语言/服务并行化执行，PR 失败即阻断合并。
# 触发：push 到 main、对 main 的 pull_request、手动 dispatch。
#
# Job 拓扑（全部并行）：
#   1. java-core       — Java 21 + Maven，含 TestContainers 集成测试
#   2. python-ai       — Python 3.12 + pytest
#   3. node-workspace  — pnpm 9 + Node 20，typecheck / lint / vitest 单测
#   4. build-images    — push 到 main 时校验各 Dockerfile 构建不破
#   5. playwright-e2e   — push 到 main 时跑前端 E2E（PR 不跑，避免阻塞）
#
# 权威源：
# - .trae/rules/testing.md（覆盖率基线、Mock 规范、CI 门禁）
# - .trae/rules/deployment.md（Docker 镜像规范、12-factor 配置外部化）
# - .trae/rules/devex.md（端口约定、DevEx 指标）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支后续 push 取消旧 run，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：仅读仓库
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Java 核心服务（Spring Boot 3.4 + JDK 21）
  # 含 TestContainers 集成测试（PostgreSQL 16 容器）
  # ──────────────────────────────────────────────────────────────
  java-core:
    name: Java 核心服务
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21（temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 缓存 Maven 仓库
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          # pom.xml 变更时自动失效
          key: maven-${{ runner.os }}-${{ hashFiles('services/core/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: 构建并测试（mvn verify，含集成测试）
        # ubuntu-latest 自带 docker daemon，TestContainers 会自动拉取 postgres:16-alpine
        # 集成测试基类：services/core/src/test/java/com/platform/core/testsupport/AbstractIntegrationTest.java
        working-directory: services/core
        run: mvn -B -ntp verify

  # ──────────────────────────────────────────────────────────────
  # Job 2: Python AI 服务（FastAPI + pytest）
  # ──────────────────────────────────────────────────────────────
  python-ai:
    name: Python AI 服务
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('services/ai/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 安装依赖（含 dev extras：pytest / pytest-asyncio / httpx）
        # editable 安装保证 src.main 等导入路径可解析
        run: pip install -e "services/ai[dev]"

      - name: 运行 pytest
        working-directory: services/ai
        # 测试目录：services/ai/tests（见 pyproject.toml testpaths）
        # asyncio_mode=auto 已在 pyproject.toml 配置，无需 CLI flag
        run: python -m pytest -q

  # ──────────────────────────────────────────────────────────────
  # Job 3: TypeScript workspace（BFF + Web + packages/shared）
  # typecheck → lint → vitest 单测
  # ──────────────────────────────────────────────────────────────
  node-workspace:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 pnpm 9
        uses: pnpm/action-setup@v4
        with:
          # 锁定版本与 packageManager 字段一致
          version: 9.15.0
          run_install: false

      - name: 配置 Node 20（启用 pnpm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 安装依赖（frozen-lockfile，禁止修改锁文件）
        run: pnpm install --frozen-lockfile

      - name: 类型检查（pnpm -r typecheck）
        # 触发 apps/web、apps/bff、packages/shared 的 typecheck 脚本
        run: pnpm -r typecheck

      - name: Lint 检查（pnpm -r lint）
        # 触发 apps/bff、apps/web、packages/shared 的 lint 脚本
        # turbo.json 中 lint 依赖 ^build，但 typecheck 已确保类型正确
        run: pnpm -r lint

      - name: 单元测试（pnpm -r test，仅 BFF 有 vitest）
        # apps/bff 使用 vitest run（非 watch），见 apps/bff/package.json test 脚本
        # apps/web 无 test 脚本（E2E 单独 Job）
        # 覆盖率门禁见 apps/bff/vitest.config.ts（行 ≥80% / 分支 ≥70%）
        run: pnpm -r test

  # ──────────────────────────────────────────────────────────────
  # Job 4: Docker 镜像构建校验（仅 push 到 main 时）
  # 验证各 Dockerfile 多阶段构建不破
  # ──────────────────────────────────────────────────────────────
  build-images:
    name: Docker 镜像构建校验
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建 core-service 镜像
        working-directory: services/core
        run: docker build -t core-service:ci .

      - name: 构建 ai-service 镜像
        working-directory: services/ai
        run: docker build -t ai-service:ci .

      - name: 构建 bff 镜像（上下文为仓库根）
        # apps/bff/Dockerfile 的 context 需为仓库根（构建时引用 packages/shared）
        run: docker build -f apps/bff/Dockerfile -t bff:ci .

      - name: 构建 web 镜像（上下文为仓库根）
        # apps/web/Dockerfile 的 context 需为仓库根（构建时引用 packages/shared）
        run: docker build -f apps/web/Dockerfile -t web:ci .

  # ──────────────────────────────────────────────────────────────
  # Job 5: 前端 E2E 测试（Playwright，仅 push 到 main 时）
  # PR 不跑 E2E，避免阻塞合并；E2E 配置在 apps/web/playwright.config.ts
  # ──────────────────────────────────────────────────────────────
  playwright-e2e:
    name: 前端 E2E（Playwright）
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: 配置 Node 20（启用 pnpm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright 浏览器（chromium）
        # apps/web/playwright.config.ts 仅启用 chromium（V1 技术试点最小集）
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: 运行 E2E
        # webServer 字段会自动启动 `next dev --port 3001`，无需手动启动后端
        # NEXT_PUBLIC_BFF_URL 已置空，测试用 page.route mock，不依赖真实 BFF
        working-directory: apps/web
        run: pnpm e2e

      - name: 上传 E2E 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

<!-- SHARED SHELL: project-shell -->
<!-- AiPilot 平台公共 Shell 片段 — 被除登录页外的所有页面 include -->
<!-- 依赖: colors_and_type.css 中的 --bd-* CSS 自定义属性 -->
<!-- Slot 标记: 页面级子 Agent 通过替换 SLOT 注释注入页面内容 -->
<style>
  /* ── Shell 布局变量 ── */
  :root {
    --shell-header-height: 56px;
    --shell-sidebar-width: 240px;
    --shell-sidebar-collapsed-width: 56px;
    --shell-content-padding: 24px;
  }

  /* ── 顶部 Header Bar ── */
  .shell-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--shell-header-height);
    padding: 0 16px;
    background: #ffffff;
    border-bottom: 1px solid var(--bd-border);
    box-shadow: var(--shadow-sm);
  }

  .shell-header__left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 200px;
  }

  .shell-header__logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--bd-foreground);
  }

  .shell-header__logo svg {
    flex-shrink: 0;
  }

  .shell-header__logo-text {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .shell-header__center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .shell-header__right {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 200px;
    justify-content: flex-end;
  }

  .shell-header__icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: var(--bd-radius-sm);
    border: none;
    background: transparent;
    color: var(--bd-muted-foreground);
    cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease;
  }

  .shell-header__icon-btn:hover {
    background-color: var(--bd-muted);
    color: var(--bd-foreground);
  }

  .shell-header__icon-btn:focus-visible {
    outline: 2px solid var(--bd-ring);
    outline-offset: 2px;
  }

  .shell-header__user {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px 4px 4px;
    border-radius: var(--bd-radius-full);
    cursor: pointer;
    transition: background-color 120ms ease;
  }

  .shell-header__user:hover {
    background-color: var(--bd-muted);
  }

  .shell-header__user:focus-visible {
    outline: 2px solid var(--bd-ring);
    outline-offset: 2px;
  }

  .shell-header__avatar {
    width: 32px;
    height: 32px;
    border-radius: var(--bd-radius-full);
    background: var(--bd-primary-100);
    color: var(--bd-primary-600);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
  }

  .shell-header__user-chevron {
    color: var(--bd-muted-foreground);
  }

  /* ── 左侧 Sidebar ── */
  .shell-sidebar {
    position: fixed;
    top: var(--shell-header-height);
    left: 0;
    bottom: 0;
    width: var(--shell-sidebar-width);
    background: #ffffff;
    border-right: 1px solid var(--bd-border);
    display: flex;
    flex-direction: column;
    z-index: 90;
    transition: width 200ms ease;
    overflow: hidden;
  }

  .shell-sidebar--collapsed {
    width: var(--shell-sidebar-collapsed-width);
  }

  .shell-sidebar__nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0;
  }

  .shell-sidebar__nav::-webkit-scrollbar {
    width: 4px;
  }

  .shell-sidebar__nav::-webkit-scrollbar-thumb {
    background: var(--bd-slate-200);
    border-radius: var(--bd-radius-full);
  }

  .shell-sidebar__nav-group-label {
    padding: 12px 12px 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--bd-muted-foreground);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
    overflow: hidden;
  }

  .shell-sidebar__item {
    display: flex;
    align-items: center;
    height: 40px;
    padding: 0 12px;
    gap: 10px;
    color: var(--bd-card-foreground);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
  }

  .shell-sidebar__item:hover {
    background-color: var(--bd-muted);
  }

  .shell-sidebar__item:focus-visible {
    outline: 2px solid var(--bd-ring);
    outline-offset: -2px;
  }

  /* 活跃导航项状态 */
  .shell-sidebar__item--active {
    background-color: var(--bd-primary-50);
    color: var(--bd-primary-600);
    border-left-color: var(--bd-primary-600);
    font-weight: 500;
  }

  .shell-sidebar__item svg {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
  }

  .shell-sidebar__item-label {
    font-size: 14px;
    line-height: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 折叠态隐藏文本 */
  .shell-sidebar--collapsed .shell-sidebar__item-label,
  .shell-sidebar--collapsed .shell-sidebar__nav-group-label {
    opacity: 0;
    width: 0;
    overflow: hidden;
  }

  .shell-sidebar--collapsed .shell-sidebar__item {
    justify-content: center;
    padding: 0;
  }

  /* ── 侧栏底部切换按钮 ── */
  .shell-sidebar__footer {
    border-top: 1px solid var(--bd-border);
    padding: 8px;
  }

  .shell-sidebar__toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 36px;
    border-radius: var(--bd-radius-sm);
    border: 1px solid var(--bd-border);
    background: #ffffff;
    color: var(--bd-muted-foreground);
    cursor: pointer;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    transition: background-color 120ms ease, color 120ms ease;
  }

  .shell-sidebar__toggle:hover {
    background-color: var(--bd-muted);
    color: var(--bd-foreground);
  }

  .shell-sidebar__toggle:focus-visible {
    outline: 2px solid var(--bd-ring);
    outline-offset: 2px;
  }

  .shell-sidebar__toggle svg {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    transition: transform 200ms ease;
  }

  .shell-sidebar--collapsed .shell-sidebar__toggle-label {
    display: none;
  }

  .shell-sidebar--collapsed .shell-sidebar__toggle svg {
    transform: rotate(180deg);
  }

  /* ── 主内容区域 ── */
  .shell-main {
    margin-left: var(--shell-sidebar-width);
    padding-top: var(--shell-header-height);
    min-height: 100vh;
    transition: margin-left 200ms ease;
  }

  .shell-main--sidebar-collapsed {
    margin-left: var(--shell-sidebar-collapsed-width);
  }

  .shell-content {
    padding: var(--shell-content-padding);
    min-height: calc(100vh - var(--shell-header-height));
  }

  /* ── 页面标题区域 ── */
  .shell-page-header {
    margin-bottom: 24px;
  }

  .shell-page-title {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.02em;
    color: var(--bd-foreground);
    margin: 0 0 4px;
  }

  .shell-page-subtitle {
    font-size: 14px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--bd-muted-foreground);
    margin: 0;
  }

  /* ── Breadcrumb ── */
  .shell-breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--bd-muted-foreground);
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .shell-breadcrumb li {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .shell-breadcrumb a {
    color: var(--bd-muted-foreground);
    text-decoration: none;
    transition: color 120ms ease;
  }

  .shell-breadcrumb a:hover {
    color: var(--bd-primary-600);
  }

  .shell-breadcrumb__sep {
    color: var(--bd-slate-300);
    flex-shrink: 0;
  }

  .shell-breadcrumb__current {
    color: var(--bd-foreground);
    font-weight: 500;
  }
</style>

<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/*
 * 施工图全流程 AI 平台 — Design System Brand CSS
 * Brand prefix: bd (building-design)
 * Style: Professional / Slate-blue / Dense enterprise workbench
 */

:root {
  /* ── Brand Primary: Slate Blue ── */
  --bd-primary-50: #eff6ff;
  --bd-primary-100: #dbeafe;
  --bd-primary-200: #bfdbfe;
  --bd-primary-300: #93c5fd;
  --bd-primary-400: #60a5fa;
  --bd-primary-500: #3b82f6;
  --bd-primary-600: #2563eb;
  --bd-primary-700: #1d4ed8;
  --bd-primary-800: #1e40af;
  --bd-primary-900: #1e3a8a;
  --bd-primary-950: #172554;

  /* ── Neutral: Slate ── */
  --bd-slate-50: #f8fafc;
  --bd-slate-100: #f1f5f9;
  --bd-slate-200: #e2e8f0;
  --bd-slate-300: #cbd5e1;
  --bd-slate-400: #94a3b8;
  --bd-slate-500: #64748b;
  --bd-slate-600: #475569;
  --bd-slate-700: #334155;
  --bd-slate-800: #1e293b;
  --bd-slate-900: #0f172a;
  --bd-slate-950: #020617;

  /* ── Semantic State Colors ── */
  --state-success: #16a34a;
  --state-success-light: #dcfce7;
  --state-success-bg: #f0fdf4;
  --state-warning: #d97706;
  --state-warning-light: #fef3c7;
  --state-warning-bg: #fffbeb;
  --state-error: #dc2626;
  --state-error-light: #fee2e2;
  --state-error-bg: #fef2f2;
  --state-info: #0891b2;
  --state-info-light: #cffafe;
  --state-info-bg: #ecfeff;

  /* ── Semantic Aliases (fill-html-head.mjs compatible) ── */
  --bd-background: #f8fafc;
  --bd-foreground: #0f172a;
  --bd-card: #ffffff;
  --bd-card-foreground: #1e293b;
  --bd-popover: #ffffff;
  --bd-popover-foreground: #1e293b;
  --bd-primary: #2563eb;
  --bd-primary-foreground: #ffffff;
  --bd-muted: #f1f5f9;
  --bd-muted-foreground: #64748b;
  --bd-border: #e2e8f0;
  --bd-input: #e2e8f0;
  --bd-ring: #3b82f6;

  /* ── Radius Scale ── */
  --bd-radius-sm: 4px;
  --bd-radius-md: 8px;
  --bd-radius-lg: 12px;
  --bd-radius-full: 9999px;

  /* ── Shadows (static ≤ 0.05 alpha, floating only) ── */
  --shadow-xs: 0 1px 2px 0 rgba(15, 23, 42, 0.03);
  --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08);
  --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1);
}

.dark {
  --bd-background: #0f172a;
  --bd-foreground: #f8fafc;
  --bd-card: #1e293b;
  --bd-card-foreground: #e2e8f0;
  --bd-popover: #1e293b;
  --bd-popover-foreground: #e2e8f0;
  --bd-primary: #3b82f6;
  --bd-primary-foreground: #ffffff;
  --bd-muted: #334155;
  --bd-muted-foreground: #94a3b8;
  --bd-border: #334155;
  --bd-input: #334155;
  --bd-ring: #60a5fa;

  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.25);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.35);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
}

/* ── Typography ── */
body {
  font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--bd-foreground);
  background-color: var(--bd-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.bd-title-lg {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.02em;
  color: var(--bd-foreground);
}

.bd-title-md {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--bd-foreground);
}

.bd-title-sm {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--bd-foreground);
}

.bd-body {
  font-size: 14px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--bd-card-foreground);
}

.bd-body-sm {
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--bd-muted-foreground);
}

.bd-caption {
  font-size: 11px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--bd-muted-foreground);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--bd-background);
    --color-foreground: var(--bd-foreground);
    --color-card: var(--bd-card);
    --color-card-foreground: var(--bd-card-foreground);
    --color-popover: var(--bd-popover);
    --color-popover-foreground: var(--bd-popover-foreground);
    --color-primary: var(--bd-primary);
    --color-primary-foreground: var(--bd-primary-foreground);
    --color-muted: var(--bd-muted);
    --color-muted-foreground: var(--bd-muted-foreground);
    --color-border: var(--bd-border);
    --color-input: var(--bd-input);
    --color-ring: var(--bd-ring);
    --radius-sm: var(--bd-radius-sm);
    --radius-md: var(--bd-radius-md);
    --radius-lg: var(--bd-radius-lg);
  }
  @layer base {
    body { background: var(--bd-background); color: var(--bd-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .bg-card { background-color: var(--bd-card); }
      .text-card { color: var(--bd-card); }
      .border-card { border-color: var(--bd-card); }
      .ring-card { --tw-ring-color: var(--bd-card); }
      .bg-card-foreground { background-color: var(--bd-card-foreground); }
      .text-card-foreground { color: var(--bd-card-foreground); }
      .border-card-foreground { border-color: var(--bd-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--bd-card-foreground); }
      .bg-popover { background-color: var(--bd-popover); }
      .text-popover { color: var(--bd-popover); }
      .border-popover { border-color: var(--bd-popover); }

      .bg-popover-foreground { background-color: var(--bd-popover-foreground); }
      .text-popover-foreground { color: var(--bd-popover-foreground); }
      .border-popover-foreground { border-color: var(--bd-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--bd-popover-foreground); }
      .bg-primary { background-color: var(--bd-primary); }
      .text-primary { color: var(--bd-primary); }
      .border-primary { border-color: var(--bd-primary); }
      .ring-primary { --tw-ring-color: var(--bd-primary); }
      .bg-primary-foreground { background-color: var(--bd-primary-foreground); }
      .text-primary-foreground { color: var(--bd-primary-foreground); }
      .border-primary-foreground { border-color: var(--bd-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--bd-primary-foreground); }
      .bg-muted { background-color: var(--bd-muted); }
      .text-muted { color: var(--bd-muted); }
      .border-muted { border-color: var(--bd-muted); }
      .ring-muted { --tw-ring-color: var(--bd-muted); }
      .bg-muted-foreground { background-color: var(--bd-muted-foreground); }
      .text-muted-foreground { color: var(--bd-muted-foreground); }

      .ring-muted-foreground { --tw-ring-color: var(--bd-muted-foreground); }
      .bg-border { background-color: var(--bd-border); }
      .text-border { color: var(--bd-border); }
      .border-border { border-color: var(--bd-border); }
      .ring-border { --tw-ring-color: var(--bd-border); }
      .bg-input { background-color: var(--bd-input); }
      .text-input { color: var(--bd-input); }
      .border-input { border-color: var(--bd-input); }
      .ring-input { --tw-ring-color: var(--bd-input); }
      .bg-ring { background-color: var(--bd-ring); }
      .text-ring { color: var(--bd-ring); }
      .border-ring { border-color: var(--bd-ring); }
      .ring-ring { --tw-ring-color: var(--bd-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>

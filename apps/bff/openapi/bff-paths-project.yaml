openapi: 3.0.3
info:
  title: AiPilot BFF Paths - Project
  version: 1.0.0
  description: |
    BFF 端 Project 域 path 路由。
    通用组件：bff-common.yaml
    业务 DTO：bff-schemas-project.yaml
    权威源：@design/D08-项目-计划-任务编排.md

paths:
  /api/v1/projects:
    get:
      tags: [Project]
      operationId: project.list
      summary: 列出项目
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          schema: { $ref: 'bff-common.yaml#/components/schemas/ProjectStatus' }
        - in: query
          name: keyword
          schema: { type: string, maxLength: 128 }
        - in: query
          name: sort
          schema: { type: string, example: '-updatedAt,id' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'bff-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: 'bff-schemas-project.yaml#/components/schemas/OffsetPage_ProjectDto' }
    post:
      tags: [Project]
      operationId: project.create
      summary: 创建项目
      parameters:
        - $ref: 'bff-common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'bff-schemas-project.yaml#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: 项目创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'bff-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: 'bff-schemas-project.yaml#/components/schemas/ProjectDto' }
        '409':
          description: 同租户内项目 code 重复
          content:
            application/json:
              schema: { $ref: 'bff-common.yaml#/components/schemas/ApiErrorResponse' }

  /api/v1/projects/{projectId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Project]
      operationId: project.get
      summary: 查询项目详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'bff-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: 'bff-schemas-project.yaml#/components/schemas/ProjectDto' }
        '404':
          $ref: 'bff-common.yaml#/components/responses/NotFound'
    patch:
      tags: [Project]
      operationId: project.update
      summary: 更新项目
      parameters:
        - $ref: 'bff-common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: 'bff-schemas-project.yaml#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'bff-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: 'bff-schemas-project.yaml#/components/schemas/ProjectDto' }
        '412':
          $ref: 'bff-common.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: 'bff-common.yaml#/components/responses/PreconditionRequired'
    delete:
      tags: [Project]
      operationId: project.delete
      summary: 归档项目
      parameters:
        - $ref: 'bff-common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { description: 成功 }
        '409':
          $ref: 'bff-common.yaml#/components/responses/Conflict'

  /api/v1/projects/{projectId}/stages:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Project]
      operationId: project.stage.list
      summary: 列出项目下所有阶段实例
      parameters:
        - in: query
          name: status
          schema: { $ref: 'bff-common.yaml#/components/schemas/StageStatus' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'bff-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: 'bff-schemas-project.yaml#/components/schemas/StageInstanceDto' }
    post:
      tags: [Project]
      operationId: project.stage.create
      summary: 为项目添加阶段实例
      parameters:
        - $ref: 'bff-common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stageCode, stageName, stageOrder]
              properties:
                stageCode: { $ref: 'bff-common.yaml#/components/schemas/StageCode' }
                stageName: { type: string, maxLength: 128 }
                stageOrder: { type: integer, minimum: 0 }
                metadata: { type: object, additionalProperties: true }
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'bff-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: 'bff-schemas-project.yaml#/components/schemas/StageInstanceDto' }

  /api/v1/projects/{projectId}/members:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Project]
      operationId: project.member.list
      summary: 列出项目成员
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'bff-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: 'bff-schemas-auth.yaml#/components/schemas/MembershipDto' }
    post:
      tags: [Project]
      operationId: project.member.add
      summary: 添加项目成员
      parameters:
        - $ref: 'bff-common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'bff-schemas-auth.yaml#/components/schemas/CreateMembershipRequest' }
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'bff-common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: 'bff-schemas-auth.yaml#/components/schemas/MembershipDto' }

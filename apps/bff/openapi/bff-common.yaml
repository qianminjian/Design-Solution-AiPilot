openapi: 3.0.3
info:
  title: AiPilot BFF Common Components
  version: 1.0.0
  description: |
    BFF API 共享通用组件：Header / Parameter / Response / SecurityScheme。
    业务域 DTO 由 `bff-schemas-*.yaml` 系列承载，避免单文件超过 500 行。

    权威源：@design/D35-API-事件契约.md + .trae/rules/api-conventions.md

components:
  # ─────────────────────────────────────────────
  # 通用 Header
  # ─────────────────────────────────────────────
  headers:
    TraceId:
      description: 全链路追踪 ID（UUIDv7）
      schema: { type: string }
    RateLimit:
      description: 限流剩余配额
      schema: { type: integer }
    RetryAfter:
      description: 重试建议秒数
      schema: { type: integer }
    Deprecation:
      description: 弃用标记
      schema: { type: string, example: 'true' }
    Sunset:
      description: 下线时间（HTTP-date）
      schema: { type: string }

  # ─────────────────────────────────────────────
  # 通用参数
  # ─────────────────────────────────────────────
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: 客户端唯一幂等键（UUIDv7），用于命令去重（D35.8）
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_\-:.]+$'
    IfMatch:
      in: header
      name: If-Match
      description: 乐观并发控制，值为资源 ETag（由 rowVersion 生成）
      required: true
      schema:
        type: string
        example: '"7"'
    CookieRefreshToken:
      in: cookie
      name: refresh_token
      description: httpOnly refresh token Cookie
      schema: { type: string }
    TenantId:
      in: header
      name: x-tenant-id
      description: 租户路由提示（必须与 token 一致）
      schema: { type: string, format: uuid }
    ProjectId:
      in: header
      name: x-project-id
      description: 项目上下文提示
      schema: { type: string, format: uuid }
    TraceId:
      in: header
      name: x-trace-id
      description: 全链路追踪 ID
      schema: { type: string }

  # ─────────────────────────────────────────────
  # 安全方案
  # ─────────────────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth/OIDC access token。
        服务间使用 workload identity / mTLS，浏览器由 BFF 持有 Cookie。
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: 浏览器持有的 httpOnly refresh token Cookie

  # ─────────────────────────────────────────────
  # 通用响应
  # ─────────────────────────────────────────────
  responses:
    BadRequest:
      description: 请求格式错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Unauthorized:
      description: 未认证
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Forbidden:
      description: 已认证但无权限
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Conflict:
      description: 状态冲突
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    ValidationError:
      description: 字段校验失败
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    PreconditionFailed:
      description: If-Match 不匹配
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    PreconditionRequired:
      description: 缺少 If-Match
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    PayloadTooLarge:
      description: 请求体过大
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    RateLimited:
      description: 请求频率超限
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    InternalError:
      description: 服务端内部错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  # ─────────────────────────────────────────────
  # 基础 Schema（统一响应 + 错误 + 共享枚举）
  # ─────────────────────────────────────────────
  schemas:
    ApiResponse:
      type: object
      required: [code, traceId]
      properties:
        code:
          type: integer
          description: 业务码，0 表示成功
          example: 0
        data:
          description: 响应数据
        message:
          type: string
          description: 可选提示信息
        traceId:
          type: string
          description: 全链路追踪 ID（UUIDv7）

    ApiErrorResponse:
      type: object
      description: |
        RFC 9457 application/problem+json 兼容错误响应。
        权威源：D35.9
      required: [errorCode, status, title, detail, correlationId, retryable]
      properties:
        errorCode:
          type: string
          description: 稳定错误码（机器可读，不本地化）
          example: RESOURCE_NOT_FOUND
        code:
          type: integer
          description: 业务码（非 0）
        status:
          type: integer
          description: HTTP 状态码
          example: 404
        title:
          type: string
          description: 可本地化错误标题
        detail:
          type: string
          description: 可本地化详细描述
        correlationId:
          type: string
          description: 关联 ID（与 traceId 同义）
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        retryable:
          type: boolean
          description: 是否可重试
        retryAfter:
          type: integer
        supportRef:
          type: string

    FieldError:
      type: object
      required: [code, pointer, parameter]
      properties:
        code: { type: string }
        pointer: { type: string, description: JSON Pointer }
        parameter: { type: string }
        resourceId: { type: string }

    # 共享枚举
    ProjectStatus:
      type: string
      enum: [active, on_hold, completed, cancelled, archived]
    BuildingType:
      type: string
      enum: [office, residential, commercial, mixed]
    StageCode:
      type: string
      enum: [STG-P0, STG-P1, STG-P2, STG-P3, STG-P4, STG-P5, STG-P6, STG-P7, STG-P8]
    StageStatus:
      type: string
      enum: [planned, active, review_preparing, under_review, conditionally_approved, approved, suspended, cancelled, closed]
    GateCode:
      type: string
      enum: [G0, G1, G2, G3, G4, G5, G6, G7, G8]
    GateStatus:
      type: string
      enum: [pending, decided, cancelled]
    GateDecision:
      type: string
      enum: [approved, conditionally_approved, rework_required, suspended, cancelled]
    RevisionStatus:
      type: string
      enum: [draft, frozen, superseded]
    PrincipalType:
      type: string
      enum: [user, service, agent, device, external]
    PrincipalStatus:
      type: string
      enum: [active, disabled, locked, pending]
    OrganizationType:
      type: string
      enum: [enterprise, department, team, external]
    MembershipStatus:
      type: string
      enum: [active, suspended, expired]
    DataClassification:
      type: string
      enum: [public, internal, project_record, sensitive, published_evidence]
    DocumentStatus:
      type: string
      enum: [DRAFT, CHECKED_OUT, PUBLISHED, SUPERSEDED, ARCHIVED]
    DocumentVersionStatus:
      type: string
      enum: [DRAFT, PUBLISHED, SUPERSEDED]

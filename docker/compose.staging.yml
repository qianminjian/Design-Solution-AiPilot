# Staging Environment Override
# 对齐 D44.5 测试环境分级：Staging/Preprod 环境（生产等价拓扑 / 匿名-合成规模数据 /
#   已签名候选 / 受控真实依赖或仿真 / D45 发布门禁 / 回滚演练）
#
# 用法：
#   docker compose -f docker/compose.yml -f docker/compose.staging.yml -p platform-staging up -d
#
# 设计原则（D44.5 + D44.6 + security.md）：
#   1. 生产等价拓扑：资源限制、网络拓扑、依赖配置与 Production 等价
#   2. 匿名/合成规模数据：使用合成生成器和已批准脱敏快照，禁止复制生产数据
#   3. 已签名候选：镜像使用 digest 锁定（image: 字段），由 CI 流水线推送
#   4. 受控真实依赖：可在 Staging 验证 LLM Provider、对象存储、消息队列等真实依赖
#   5. D45 发布门禁：所有 D45 验收用例（功能/契约/性能/安全/可用性）必须在 Staging 通过
#   6. 回滚演练：定期在 Staging 演练回滚流程，验证 RPO/RTO 达标
#   7. HTTPS via Nginx：通过 Nginx 反向代理提供 HTTPS 访问入口
#   8. 独立账号/订阅/Cluster/KMS Root/数据库/Bucket/Topic/域名/身份信任域
#
# 与基础 compose.yml 的差异：
#   - 资源限制与生产等价（与 Dev 相比显著增大）
#   - health check 间隔适中（生产等价配置）
#   - 启动等待时间正常（避免误判）
#   - 暴露端口仅 Nginx HTTPS（443）+ 内部健康检查端口
#   - SPRING_PROFILES_ACTIVE=staging（启用 Staging 专用配置）
#   - NODE_ENV=production（生产模式）
#   - LOG_LEVEL=info（生产等价日志级别）

services:
  postgres:
    environment:
      POSTGRES_DB: ${DB_NAME:-design_platform_staging}
      POSTGRES_USER: ${DB_USER:-platform_staging}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?STAGING_DB_PASSWORD is required}
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    ports: !reset []
    # Staging 环境不暴露 PostgreSQL 端口（仅内部网络可访问）

  minio:
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?STAGING_S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?STAGING_S3_SECRET_KEY is required}
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped
    ports: !reset []

  minio-init:
    environment:
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-platform-data-staging}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?STAGING_S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?STAGING_S3_SECRET_KEY is required}
    restart: "no"

  chromadb:
    environment:
      CHROMA_SERVER_AUTH_CREDENTIALS: ${CHROMADB_AUTH_CREDENTIALS:?STAGING_CHROMADB_AUTH_CREDENTIALS is required}
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      interval: 10s
      timeout: 30s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    ports: !reset []

  core-service:
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_NAME: ${DB_NAME:-design_platform_staging}
      DB_USER: ${DB_USER:-platform_staging}
      DB_PASSWORD: ${DB_PASSWORD:?STAGING_DB_PASSWORD is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?STAGING_S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?STAGING_S3_SECRET_KEY is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-platform-data-staging}
      CHROMADB_AUTH_CREDENTIALS: ${CHROMADB_AUTH_CREDENTIALS:?STAGING_CHROMADB_AUTH_CREDENTIALS is required}
      # Staging 环境允许真实 LLM 调用（受控真实依赖验证）
      LLM_API_KEY: ${LLM_API_KEY:?STAGING_LLM_API_KEY is required}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LOG_LEVEL: info
      # Staging 环境开启详细审计日志（用于 D45 验收证据）
      AUDIT_LOG_DETAILED: "true"
      # 调度任务在 Staging 启用（验证 A-64 Token 清理等）
      SCHEDULER_ENABLED: "true"
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    ports: !reset []

  ai-service:
    environment:
      ENVIRONMENT: staging
      LOG_LEVEL: info
      DB_NAME: ${DB_NAME:-design_platform_staging}
      DB_USER: ${DB_USER:-platform_staging}
      DB_PASSWORD: ${DB_PASSWORD:?STAGING_DB_PASSWORD is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?STAGING_S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?STAGING_S3_SECRET_KEY is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-platform-data-staging}
      CHROMADB_AUTH_CREDENTIALS: ${CHROMADB_AUTH_CREDENTIALS:?STAGING_CHROMADB_AUTH_CREDENTIALS is required}
      LLM_API_KEY: ${LLM_API_KEY:?STAGING_LLM_API_KEY is required}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    ports: !reset []

  bff:
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      CORS_ORIGIN: ${CORS_ORIGIN:?STAGING_CORS_ORIGIN is required}
    mem_limit: 192m
    memswap_limit: 192m
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    ports: !reset []

  web:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL:?STAGING_NEXT_PUBLIC_BFF_URL is required}
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    ports: !reset []

  # Staging 环境 Nginx 反向代理（HTTPS 入口）
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/yun.gxjugu.com.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
      bff:
        condition: service_healthy
    networks:
      - backend_network
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

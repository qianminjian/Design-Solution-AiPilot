# V1 Docker Compose — 施工图全流程 AI 平台
# 对标 D34.24.1 V0 模块化单体部署架构，新增 AI 服务依赖：ChromaDB + MinIO
# 升级至 K8s 的条件见 D34.24.1 演进路径

services:
  # ── 基础设施 ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-platform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-platform_dev}
      POSTGRES_DB: ${DB_NAME:-design_platform}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_network
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c track_activity_query_size=2048
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-platform} -d ${DB_NAME:-design_platform}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - backend_network
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
        mc mb --ignore-existing local/${S3_BUCKET_NAME:-platform-data} &&
        mc version enable local/${S3_BUCKET_NAME:-platform-data} &&
        echo 'MinIO bucket initialized: ${S3_BUCKET_NAME:-platform-data}'
      "
    networks:
      - backend_network
    restart: "no"

  chromadb:
    image: chromadb/chroma:latest
    environment:
      CHROMA_SERVER_AUTH_CREDENTIALS: ${CHROMADB_AUTH_CREDENTIALS:-chroma:chromasecret}
      CHROMA_SERVER_AUTH_PROVIDER: chromadb.auth.providers.token.TokenAuthServerProvider
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma
    networks:
      - backend_network
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "apt-get update && apt-get install -y curl && curl -f http://localhost:8000/api/v2/heartbeat",
        ]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 核心业务服务（Java 21 + Spring Boot 3.4） ──
  core-service:
    build:
      context: ../services/core
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      LOGSTASH_ENCODER_CONFIG: '{"service": "core-service"}'
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-design_platform}
      DB_USER: ${DB_USER:-platform}
      DB_PASSWORD: ${DB_PASSWORD:-platform_dev}
      DB_POOL_MAX: "20"
      DB_POOL_MIN: "5"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-platform-data}
      S3_REGION: ${S3_REGION:-us-east-1}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend_network
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── Python AI 服务（Python 3.12 + FastAPI） ──
  ai-service:
    build:
      context: ../services/ai
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-design_platform}
      DB_USER: ${DB_USER:-platform}
      DB_PASSWORD: ${DB_PASSWORD:-platform_dev}
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      CHROMADB_URL: http://chromadb:8000
      CHROMADB_AUTH_CREDENTIALS: ${CHROMADB_AUTH_CREDENTIALS:-chroma:chromasecret}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-platform-data}
      S3_REGION: ${S3_REGION:-us-east-1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_TIMEOUT: "30"
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend_network
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c \"exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q '200 OK'\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── BFF（NestJS 11） ──
  bff:
    build:
      context: ../
      dockerfile: apps/bff/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3001"
      CORE_SERVICE_URL: http://core-service:8080
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    depends_on:
      core-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - backend_network
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const s=require(''net'').createConnection(3001,''localhost'');s.on(''connect'',()=>{s.end();process.exit(0)});s.on(''error'',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 前端（Next.js 15） ──
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BFF_URL: http://bff:3001
      NEXT_PUBLIC_BFF_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - backend_network
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  backend_network:
    driver: bridge
    internal: false

volumes:
  pgdata:
  miniodata:
  chromadata:

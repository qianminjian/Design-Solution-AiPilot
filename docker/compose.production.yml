# V1 生产 Docker Compose — 施工图全流程 AI 平台（AiDesign 用户隔离部署）
# 隔离策略：
#   - project name: aidesign（独立命名空间，不与其他项目冲突）
#   - 端口段：18000-18099（仅绑定 127.0.0.1，由 Nginx 反代对外）
#   - 数据卷：绑定到 /home/AiDesign/data 下
#   - network: aidesign-net（独立 bridge）

name: aidesign

services:
  # ── 基础设施 ──
  postgres:
    image: postgres:16-alpine
    container_name: aidesign-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18010:5432" # 仅本机访问，不对外暴露
    volumes:
      - /home/AiDesign/data/postgres:/var/lib/postgresql/data
    networks:
      - aidesign-net
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aidesign-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: https://yun.gxjugu.com/minio-console/
    ports:
      - "127.0.0.1:18020:9000"
      - "127.0.0.1:18021:9001"
    volumes:
      - /home/AiDesign/data/minio:/data
    networks:
      - aidesign-net
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: aidesign-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
        mc mb --ignore-existing local/${S3_BUCKET_NAME} &&
        mc version enable local/${S3_BUCKET_NAME} &&
        echo 'MinIO bucket initialized: ${S3_BUCKET_NAME}'
      "
    networks:
      - aidesign-net
    restart: "no"

  chromadb:
    image: chromadb/chroma:latest
    container_name: aidesign-chromadb
    environment:
      CHROMA_SERVER_AUTH_CREDENTIALS: ${CHROMADB_AUTH_CREDENTIALS}
      CHROMA_SERVER_AUTH_PROVIDER: chromadb.auth.providers.token.TokenAuthServerProvider
    ports:
      - "127.0.0.1:18030:8000"
    volumes:
      - /home/AiDesign/data/chroma:/chroma/chroma
    networks:
      - aidesign-net
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v2/heartbeat"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 核心业务服务（Java 21 + Spring Boot 3.4） ──
  core-service:
    build:
      context: ../services/core
      dockerfile: Dockerfile
    container_name: aidesign-core
    environment:
      SPRING_PROFILES_ACTIVE: docker
      LOGSTASH_ENCODER_CONFIG: '{"service": "core-service"}'
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: "20"
      DB_POOL_MIN: "5"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-us-east-1}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      CORS_ORIGIN: https://yun.gxjugu.com
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:18040:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - aidesign-net
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ── Python AI 服务 ──
  ai-service:
    build:
      context: ../services/ai
      dockerfile: Dockerfile
    container_name: aidesign-ai
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      CHROMADB_URL: http://chromadb:8000
      CHROMADB_AUTH_CREDENTIALS: ${CHROMADB_AUTH_CREDENTIALS}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-us-east-1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: "30"
      CORS_ORIGINS: '["https://yun.gxjugu.com"]'
    ports:
      - "127.0.0.1:18050:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - aidesign-net
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── BFF（NestJS 11） ──
  bff:
    build:
      context: ../
      dockerfile: apps/bff/Dockerfile
    container_name: aidesign-bff
    environment:
      NODE_ENV: production
      PORT: "3001"
      CORE_SERVICE_URL: http://core-service:8080
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: https://yun.gxjugu.com
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:18060:3001"
    depends_on:
      core-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - aidesign-net
    mem_limit: 192m
    memswap_limit: 192m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const s=require(''net'').createConnection(3001,''localhost'');s.on(''connect'',()=>{s.end();process.exit(0)});s.on(''error'',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── 前端（Next.js 15） ──
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BFF_URL: /api/bff
    container_name: aidesign-web
    environment:
      NODE_ENV: production
      BFF_URL: http://bff:3001
      NEXT_PUBLIC_BFF_URL: /api/bff
    ports:
      - "127.0.0.1:18070:3000"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - aidesign-net
    mem_limit: 384m
    memswap_limit: 384m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const h=require(''http'');const r=h.request({host:''localhost'',port:3000,timeout:3000},res=>{process.exit(res.statusCode<500?0:1)});r.on(''timeout'',()=>{r.destroy();process.exit(1)});r.on(''error'',()=>process.exit(1));r.end()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

networks:
  aidesign-net:
    name: aidesign-net
    driver: bridge
    internal: false

# AiDesign 测试验证环境 Nginx 配置
# 部署位置：/etc/nginx/conf.d/yun.gxjugu.com-aidesign.conf
# 隔离说明：本文件仅配置本项目的反向代理，不影响 /etc/nginx/nginx.conf 主配置与其他 server 块

# 上游服务（仅本机访问，通过 127.0.0.1:port）
upstream aidesign_web {
    server 127.0.0.1:18070;
    keepalive 32;
}

upstream aidesign_bff {
    server 127.0.0.1:18060;
    keepalive 32;
}

upstream aidesign_core {
    server 127.0.0.1:18040;
    keepalive 32;
}

upstream aidesign_ai {
    server 127.0.0.1:18050;
    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name yun.gxjugu.com;

    # Let's Encrypt 验证用（certbot 会自动添加）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主 server
server {
    listen 443 ssl http2;
    server_name yun.gxjugu.com;

    # TLS 证书（Let's Encrypt，certbot 申请后自动填充路径）
    ssl_certificate /etc/letsencrypt/live/yun.gxjugu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yun.gxjugu.com/privkey.pem;

    # TLS 配置（security.md §2.1）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（security.md §2.1）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 其他安全头（security.md §7）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 客户端请求体大小（设计文件上传）
    client_max_body_size 500M;

    # 访问日志独立文件（便于排查）
    access_log /var/log/nginx/aidesign-access.log;
    error_log /var/log/nginx/aidesign-error.log;

    # 通用 proxy 头
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # BFF API（api-conventions.md：路径前缀方案）
    location /api/bff/ {
        proxy_pass http://aidesign_bff/;
    }

    # Core API
    location /api/core/ {
        proxy_pass http://aidesign_core/;
    }

    # AI API
    location /api/ai/ {
        proxy_pass http://aidesign_ai/;
        # AI 调用可能较长，超时 60s
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # MinIO Console（仅开发测试，建议加 IP 白名单或 Basic Auth）
    location /minio-console/ {
        proxy_pass http://127.0.0.1:18021/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    # 健康检查端点（直接到 BFF）
    location = /health {
        proxy_pass http://aidesign_bff/health;
        access_log off;
    }

    # Web 前端（默认 location，必须放最后）
    location / {
        proxy_pass http://aidesign_web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Next.js HMR 与静态资源
    }
}

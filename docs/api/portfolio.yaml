openapi: 3.0.3
info:
  title: AiPilot Project (Portfolio) API
  version: 1.0.0
  description: |
    项目 Portfolio 域 OpenAPI 契约。

    ## 范围
    - 项目（Project）CRUD
    - 阶段实例（StageInstance）：项目下的阶段状态
    - 成员（Membership）：项目级成员关系
    - 注：门禁（Gate）与基线（Baseline）见 `workflow.yaml`

    ## 核心不变量
    - 项目作用域（scope）固定：项目下资源 tenantId + projectId 强约束
    - floorsMin ≤ floorsMax（V0 默认 5-15 办公建筑，OD-02）
    - V0 阶段集默认 STG-P0/P1/P2/P5/P6/P7（D05.18 裁剪）

    ## 业务错误码段
    - 2xxx：Project 域
      - 2001 PROJECT_NOT_FOUND
      - 2002 PROJECT_DUPLICATE_CODE
      - 2010 STAGE_INVALID_TRANSITION

    权威源：@design/D08-项目-计划-任务编排.md + @design/D05-全流程阶段-阶段门.md
  contact:
    name: Portfolio Service Team
    email: portfolio@aipilot.example

servers:
  - url: https://api.aipilot.example
    description: 生产
  - url: http://localhost:8080
    description: 本地

tags:
  - name: Project
    description: 项目 CRUD
  - name: Stage
    description: 项目下的阶段实例
  - name: Member
    description: 项目级成员关系

security:
  - BearerAuth: []

paths:
  # ─────────────────────────────────────────────
  # Project
  # ─────────────────────────────────────────────
  /api/v1/projects:
    get:
      tags: [Project]
      operationId: project.list
      summary: 列出项目
      description: |
        - 偏移分页（D35.6：管理字典用偏移，资产用游标）
        - 默认按 `-updatedAt,id` 排序
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ProjectStatus' }
        - in: query
          name: buildingType
          schema: { $ref: '#/components/schemas/BuildingType' }
        - in: query
          name: keyword
          schema: { type: string, maxLength: 128 }
        - in: query
          name: sort
          schema: { type: string, example: '-updatedAt,id' }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc] }
        - $ref: 'common.yaml#/components/parameters/TenantId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ProjectDto' }
                          total: { type: integer }
                          page: { type: integer }
                          pageSize: { type: integer }
                          hasMore: { type: boolean }
              examples:
                success:
                  value:
                    code: 0
                    data:
                      items:
                        - id: 0190f8e9-aabb-7c01-2345-6789abcdef10
                          tenantId: 0190f8e9-aabb-7c01-2345-6789abcdef02
                          code: PRJ-2026-001
                          name: 境外主创方案深化-某某项目
                          status: active
                          buildingType: office
                          floorsMin: 5
                          floorsMax: 12
                          gfa: "12500.0000"
                          siteArea: "3200.0000"
                          region: ap-east-1
                          language: en-US
                          startedAt: '2026-07-21T00:00:00Z'
                          createdAt: '2026-07-21T10:00:00Z'
                          updatedAt: '2026-07-22T03:14:00Z'
                          rowVersion: 3
                      total: 24
                      page: 1
                      pageSize: 20
                      hasMore: true
                    traceId: 0190f8e9-aabb-7c01-2345-6789abcdef03
    post:
      tags: [Project]
      operationId: project.create
      summary: 创建项目
      description: |
        **D35.15.1 示例 1：创建项目**。需要 Idempotency-Key。
        V0 阶段集默认 STG-P0/P1/P2/P5/P6/P7。
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
            examples:
              standard:
                summary: 标准办公项目（V0 默认）
                value:
                  name: 境外主创方案深化-某某项目
                  code: PRJ-2026-001
                  buildingType: office
                  floorsMin: 5
                  floorsMax: 12
                  gfa: "12500.0000"
                  siteArea: "3200.0000"
                  region: ap-east-1
                  language: en-US
                  stages: [STG-P0, STG-P1, STG-P2, STG-P5, STG-P6, STG-P7]
                  startedAt: '2026-07-21T00:00:00Z'
                  targetCompletionAt: '2026-12-31T00:00:00Z'
      responses:
        '201':
          description: 项目创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProjectDto' }
        '409':
          description: 同租户内项目 code 重复
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }
              examples:
                duplicateCode:
                  value:
                    errorCode: STATE_CONFLICT
                    code: 2002
                    status: 409
                    title: 项目编码重复
                    detail: 租户内 code 已存在
                    correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                    retryable: false
        '422':
          $ref: 'common.yaml#/components/responses/ValidationError'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'

  /api/v1/projects/{projectId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Project]
      operationId: project.get
      summary: 查询项目详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProjectDto' }
        '404':
          description: 项目不存在
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }
              examples:
                notFound:
                  value:
                    errorCode: RESOURCE_NOT_FOUND
                    code: 2001
                    status: 404
                    title: 项目不存在
                    detail: 项目不存在或已被归档
                    correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                    retryable: false
    patch:
      tags: [Project]
      operationId: project.update
      summary: 更新项目（部分更新）
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProjectDto' }
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: 'common.yaml#/components/parameters/IfMatch'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
    delete:
      tags: [Project]
      operationId: project.delete
      summary: 归档项目
      description: |
        软删除（status → archived），不允许物理删除有数据的项目。
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      responses:
        '204':
          description: 成功
        '409':
          description: 项目有未关闭阶段或活跃门禁
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }

  # ─────────────────────────────────────────────
  # Stage
  # ─────────────────────────────────────────────
  /api/v1/projects/{projectId}/stages:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Stage]
      operationId: project.stage.list
      summary: 列出项目下所有阶段实例
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/StageStatus' }
        - in: query
          name: stageCode
          schema: { $ref: '#/components/schemas/StageCode' }
        - in: query
          name: sort
          schema: { type: string, example: 'stageOrder' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StageInstanceDto' }
    post:
      tags: [Stage]
      operationId: project.stage.create
      summary: 创建阶段实例
      description: |
        一般在创建项目时一次性创建阶段集，本接口用于补建阶段。
        阶段状态流转见 `POST /api/v1/stages/{stageId}/transition`（workflow.yaml）。
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stageCode, stageName, stageOrder]
              properties:
                stageCode: { $ref: '#/components/schemas/StageCode' }
                stageName: { type: string, maxLength: 128 }
                stageOrder: { type: integer, minimum: 0 }
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StageInstanceDto' }
        '409':
          description: 阶段已存在或 stageOrder 冲突
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }

  # ─────────────────────────────────────────────
  # Member
  # ─────────────────────────────────────────────
  /api/v1/projects/{projectId}/members:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Member]
      operationId: project.member.list
      summary: 列出项目成员
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, suspended, expired]
        - in: query
          name: role
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MembershipDto' }
    post:
      tags: [Member]
      operationId: project.member.add
      summary: 添加项目成员
      description: |
        - 需 Idempotency-Key
        - 角色取值：PRINCIPAL_ARCHITECT / ARCHITECT / REVIEWER / PROJECT_MANAGER / CLIENT
        - 重复添加返回 409
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalId, role]
              properties:
                principalId: { type: string, format: uuid }
                organizationId: { type: string, format: uuid }
                role:
                  type: string
                  enum: [PRINCIPAL_ARCHITECT, ARCHITECT, REVIEWER, PROJECT_MANAGER, CLIENT]
                effectiveFrom: { type: string, format: date-time }
                effectiveTo: { type: string, format: date-time }
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MembershipDto' }
        '409':
          description: 主体已是项目成员
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── 枚举 ──
    ProjectStatus:
      type: string
      enum: [active, on_hold, completed, cancelled, archived]
    BuildingType:
      type: string
      enum: [office, residential, commercial, mixed]
    StageCode:
      type: string
      enum: [STG-P0, STG-P1, STG-P2, STG-P3, STG-P4, STG-P5, STG-P6, STG-P7, STG-P8]
    StageStatus:
      type: string
      enum: [planned, active, review_preparing, under_review, conditionally_approved, approved, suspended, cancelled, closed]

    # ── Project DTO ──
    ProjectDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid, nullable: true }
        code: { type: string, example: PRJ-2026-001 }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        buildingType: { $ref: '#/components/schemas/BuildingType' }
        floorsMin: { type: integer, minimum: 1, maximum: 15 }
        floorsMax: { type: integer, minimum: 1, maximum: 15 }
        gfa:
          type: string
          nullable: true
          description: 总建筑面积 m²（NUMERIC(20,4) 字符串）
        siteArea:
          type: string
          nullable: true
          description: 占地面积 m²
        region: { type: string, example: ap-east-1 }
        language: { type: string, example: en-US }
        classification: { type: string }
        settings:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        startedAt: { type: string, format: date-time, nullable: true }
        targetCompletionAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
        updatedBy: { type: string, format: uuid }
        rowVersion: { type: integer }

    CreateProjectRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 256 }
        code:
          type: string
          maxLength: 64
          pattern: '^[A-Z0-9_-]+$'
          example: PRJ-2026-001
        organizationId: { type: string, format: uuid, nullable: true }
        description: { type: string, maxLength: 1024 }
        buildingType: { $ref: '#/components/schemas/BuildingType' }
        floorsMin: { type: integer, minimum: 1, maximum: 15 }
        floorsMax: { type: integer, minimum: 1, maximum: 15 }
        gfa: { type: string, description: NUMERIC(20,4) 字符串 }
        siteArea: { type: string }
        region: { type: string, example: ap-east-1 }
        language: { type: string, default: en-US }
        stages:
          type: array
          description: V0 阶段集，默认 STG-P0/P1/P2/P5/P6/P7
          items: { $ref: '#/components/schemas/StageCode' }
        settings:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        startedAt: { type: string, format: date-time }
        targetCompletionAt: { type: string, format: date-time }

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, maxLength: 256 }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        buildingType: { $ref: '#/components/schemas/BuildingType' }
        floorsMin: { type: integer, minimum: 1, maximum: 15 }
        floorsMax: { type: integer, minimum: 1, maximum: 15 }
        gfa: { type: string, nullable: true }
        siteArea: { type: string, nullable: true }
        settings:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        startedAt: { type: string, format: date-time, nullable: true }
        targetCompletionAt: { type: string, format: date-time, nullable: true }

    StageInstanceDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        stageCode: { $ref: '#/components/schemas/StageCode' }
        stageName: { type: string }
        stageOrder: { type: integer }
        status: { $ref: '#/components/schemas/StageStatus' }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer }

    MembershipDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid, nullable: true }
        projectId: { type: string, format: uuid }
        role: { type: string }
        status:
          type: string
          enum: [active, suspended, expired]
        joinedAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer }

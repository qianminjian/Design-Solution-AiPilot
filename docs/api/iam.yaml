openapi: 3.0.3
info:
  title: AiPilot IAM API
  version: 1.0.0
  description: |
    身份与多租户（Identity & Access Management）域 OpenAPI 契约。

    ## 范围
    - 租户（Tenant）、组织（Organization）、主体（Principal）
    - 成员关系（Membership）、角色绑定（RoleBinding）、显式授权（AccessGrant）
    - 认证（Auth）：login / logout / refresh / me / change-password / register

    ## 稳定契约 ID
    见 `design/r2-contract-catalog/` 中分配的 30 个 Operation 稳定 ID。
    本域对应 ID 段：iam.auth.*、iam.principal.*、iam.organization.*、iam.membership.*、iam.role-binding.*、iam.grant.*

    权威源：@design/D39-身份多租户-授权.md + @design/D35-API-事件契约.md
  contact:
    name: Identity Service Team
    email: iam@aipilot.example

servers:
  - url: https://api.aipilot.example
    description: 生产
  - url: http://localhost:8080
    description: 本地（Core Service 直连调试）

tags:
  - name: Auth
    description: 认证与 Token 管理
  - name: Principal
    description: 主体（用户、服务、Agent、设备、外部）
  - name: Organization
    description: 组织（企业、部门、团队、外部）
  - name: Membership
    description: 成员关系（主体与组织）
  - name: RoleBinding
    description: 角色绑定（RBAC 作用域）
  - name: Grant
    description: 显式授权（ABAC 资源级）

security:
  - BearerAuth: []

paths:
  # ─────────────────────────────────────────────
  # Auth（认证）
  # ─────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: iam.auth.login
      summary: 用户登录
      security: []
      description: |
        - 业务错误码段：1xxx
        - 错误示例：1001 INVALID_CREDENTIALS、1003 ACCOUNT_LOCKED
        - 防暴力：5 次失败锁定 15 分钟
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              standard:
                value:
                  email: alice@aipilot.example
                  password: '********'
                  rememberMe: false
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: |
                refreshToken Cookie（HttpOnly + Secure + SameSite=Strict）。
                BFF 模式下由 BFF 持有，浏览器通过 Cookie 自动发送。
              schema: { type: string }
            x-trace-id: { $ref: 'common.yaml#/components/headers/TraceId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
              examples:
                success:
                  value:
                    code: 0
                    data:
                      principal:
                        id: 0190f8e9-aabb-7c01-2345-6789abcdef01
                        tenantId: 0190f8e9-aabb-7c01-2345-6789abcdef02
                        email: alice@aipilot.example
                        displayName: Alice
                        type: user
                        status: active
                        locale: en-US
                        timezone: Asia/Shanghai
                      accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
                      accessTokenExpiresIn: 900
                      refreshTokenSet: true
                      tenant:
                        id: 0190f8e9-aabb-7c01-2345-6789abcdef02
                        name: Acme Studio
                        code: ACME
                        region: ap-east-1
                        language: en-US
                      roles: [ARCHITECT]
                      permissions: [DESIGN_READ, DESIGN_WRITE]
                    message: ok
                    traceId: 0190f8e9-aabb-7c01-2345-6789abcdef03
        '401':
          description: 凭据无效或账户锁定
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }
              examples:
                invalidCredentials:
                  value:
                    errorCode: AUTHENTICATION_REQUIRED
                    code: 1001
                    status: 401
                    title: 凭据无效
                    detail: 邮箱或密码错误（剩余尝试次数 3）
                    correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                    retryable: false
                accountLocked:
                  value:
                    errorCode: ACCESS_DENIED
                    code: 1003
                    status: 403
                    title: 账户已锁定
                    detail: 连续 5 次登录失败，请 15 分钟后重试
                    correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                    retryable: false
        '422':
          $ref: 'common.yaml#/components/responses/ValidationError'
        '429':
          $ref: 'common.yaml#/components/responses/RateLimited'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: iam.auth.register
      summary: 注册新主体（自助注册）
      security: []
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PrincipalDto' }
        '409':
          description: 邮箱已被注册
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }
              examples:
                duplicateEmail:
                  value:
                    errorCode: STATE_CONFLICT
                    code: 1012
                    status: 409
                    title: 邮箱已被注册
                    detail: 同租户下 email 已存在
                    correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                    retryable: false
        '422':
          $ref: 'common.yaml#/components/responses/ValidationError'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: iam.auth.refresh
      summary: 刷新 access token
      security: []
      description: |
        Rotation 模式：旧 refresh token 立即失效。
        缺少 Cookie → 401 AUTHENTICATION_REQUIRED。
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 刷新成功
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RefreshTokenResponse' }
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: iam.auth.logout
      summary: 登出
      description: |
        - 默认仅撤销当前设备 refresh token
        - allDevices=true 撤销该用户所有设备会话
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LogoutResponse' }

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: iam.auth.change-password
      summary: 修改当前用户密码
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiResponse' }
        '422':
          description: 旧密码错误或新密码不符合策略
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: iam.auth.me
      summary: 获取当前登录上下文
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthContext' }
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────
  # Principal（主体）
  # ─────────────────────────────────────────────
  /api/v1/principals:
    get:
      tags: [Principal]
      operationId: iam.principal.list
      summary: 列出主体
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/PrincipalStatus' }
        - in: query
          name: type
          schema: { $ref: '#/components/schemas/PrincipalType' }
        - in: query
          name: keyword
          schema: { type: string, maxLength: 128 }
        - in: query
          name: sort
          schema: { type: string, example: '-updatedAt,id' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PrincipalDto' }
                          total: { type: integer }
                          page: { type: integer }
                          pageSize: { type: integer }
                          hasMore: { type: boolean }
    post:
      tags: [Principal]
      operationId: iam.principal.create
      summary: 创建主体
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePrincipalRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PrincipalDto' }
        '409':
          description: 邮箱重复
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }
        '422':
          $ref: 'common.yaml#/components/responses/ValidationError'

  /api/v1/principals/{principalId}:
    parameters:
      - in: path
        name: principalId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Principal]
      operationId: iam.principal.get
      summary: 查询主体详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PrincipalDto' }
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
    patch:
      tags: [Principal]
      operationId: iam.principal.update
      summary: 更新主体（部分更新）
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdatePrincipalRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: 'common.yaml#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PrincipalDto' }
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: 'common.yaml#/components/responses/PreconditionRequired'
    delete:
      tags: [Principal]
      operationId: iam.principal.delete
      summary: 软删除主体（status → disabled）
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      responses:
        '204':
          description: 成功
        '409':
          description: 主体有关联资源（活跃会话、未关闭项目）
          content:
            application/problem+json:
              schema: { $ref: 'common.yaml#/components/schemas/ApiErrorResponse' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token

  schemas:
    # ── 枚举 ──
    PrincipalType:
      type: string
      enum: [user, service, agent, device, external]
    PrincipalStatus:
      type: string
      enum: [active, disabled, locked, pending]
    OrganizationType:
      type: string
      enum: [enterprise, department, team, external]
    OrganizationStatus:
      type: string
      enum: [active, archived]
    MembershipStatus:
      type: string
      enum: [active, suspended, expired]
    RoleScopeType:
      type: string
      enum: [tenant, organization, project]
    GrantEffect:
      type: string
      enum: [allow, deny]

    # ── Auth DTO ──
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        rememberMe: { type: boolean, default: false }

    LoginResponse:
      type: object
      properties:
        principal: { $ref: '#/components/schemas/PrincipalSummary' }
        accessToken:
          type: string
          description: |
            JWT access token（BFF 模式下由 BFF 持有，不返回浏览器）。
            有效期 ≤ 15min。
        accessTokenExpiresIn:
          type: integer
          example: 900
        refreshTokenSet:
          type: boolean
          description: refresh token 通过 httpOnly Cookie 设置
        tenant: { $ref: '#/components/schemas/TenantSummary' }
        roles:
          type: array
          items: { type: string }
          example: [ARCHITECT]
        permissions:
          type: array
          items: { type: string }
          example: [DESIGN_READ, DESIGN_WRITE]

    RefreshTokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer }
        refreshTokenSet: { type: boolean }

    LogoutRequest:
      type: object
      properties:
        allDevices:
          type: boolean
          default: false
          description: 是否撤销所有设备的会话

    LogoutResponse:
      type: object
      properties:
        revoked: { type: boolean }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword:
          type: string
          format: password
          minLength: 12
          description: 至少 12 字符，含大小写+数字+特殊字符

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        displayName: { type: string, maxLength: 128 }
        locale: { type: string, default: en-US }
        timezone: { type: string, default: UTC }
        externalId: { type: string }

    AuthContext:
      type: object
      properties:
        principal: { $ref: '#/components/schemas/PrincipalSummary' }
        tenant: { $ref: '#/components/schemas/TenantSummary' }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        session:
          type: object
          properties:
            id: { type: string, format: uuid }
            issuedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }

    PrincipalSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        type: { $ref: '#/components/schemas/PrincipalType' }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        locale: { type: string }
        timezone: { type: string }

    TenantSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        region: { type: string }
        language: { type: string }

    # ── Principal DTO ──
    PrincipalDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/PrincipalType' }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        locale: { type: string }
        timezone: { type: string }
        classification: { $ref: 'common.yaml#/components/schemas/DataClassification' }
        externalId: { type: string, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer }

    CreatePrincipalRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 128 }
        password: { type: string, format: password, minLength: 12 }
        type: { $ref: '#/components/schemas/PrincipalType' }
        locale: { type: string }
        timezone: { type: string }
        externalId: { type: string }
        metadata:
          type: object
          additionalProperties: true

    UpdatePrincipalRequest:
      type: object
      properties:
        displayName: { type: string, maxLength: 128 }
        status: { $ref: '#/components/schemas/PrincipalStatus' }
        locale: { type: string }
        timezone: { type: string }
        metadata:
          type: object
          additionalProperties: true

    MembershipDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        role: { type: string }
        status: { $ref: '#/components/schemas/MembershipStatus' }
        joinedAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer }

    CreateMembershipRequest:
      type: object
      required: [principalId, organizationId, role]
      properties:
        principalId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        role: { type: string, maxLength: 64 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }

openapi: 3.0.3
info:
  title: AiPilot Common Schemas
  version: 1.0.0
  description: |
    各域 OpenAPI 文档共用的通用 Schema 与响应定义。
    其他域的 OpenAPI 通过 `$ref: 'common.yaml#/components/schemas/...'` 引用。

    权威源：@design/D35-API-事件契约.md + @design/D39-身份多租户-授权.md
  contact:
    name: AiPilot Platform Team
    email: platform@aipilot.example

components:
  # ─────────────────────────────────────────────
  # 通用 Header
  # ─────────────────────────────────────────────
  headers:
    TraceId:
      description: 全链路追踪 ID（UUIDv7）
      schema: { type: string }
    RateLimit:
      description: 限流剩余配额
      schema: { type: integer }
    RetryAfter:
      description: 重试建议秒数
      schema: { type: integer }
    Deprecation:
      description: 弃用标记
      schema: { type: string, example: 'true' }
    Sunset:
      description: 下线时间（HTTP-date）
      schema: { type: string }

  # ─────────────────────────────────────────────
  # 通用参数
  # ─────────────────────────────────────────────
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: |
        客户端唯一幂等键（UUIDv7）。命令去重作用域：
        (tenant, stableClientId, operation, idempotencyKey)
        同一键 + 同指纹 → 返回首次响应；同键 + 不同指纹 → 422 IDEMPOTENCY_KEY_REUSED
        权威源：D35.8
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_\-:.]+$'
    IfMatch:
      in: header
      name: If-Match
      description: |
        乐观并发控制，值为资源 ETag（由 rowVersion 生成）。
        不匹配返回 412 REVISION_CONFLICT。
      required: true
      schema:
        type: string
        example: '"7"'
    TenantId:
      in: header
      name: x-tenant-id
      description: 租户路由提示（必须与 token/授权上下文一致）
      schema: { type: string, format: uuid }
    ProjectId:
      in: header
      name: x-project-id
      description: 项目上下文提示
      schema: { type: string, format: uuid }
    AcceptLanguage:
      in: header
      name: Accept-Language
      description: 本地化（zh-CN、en-US 等）
      schema: { type: string, example: en-US }
    PageSize:
      in: query
      name: pageSize
      description: 每页条数
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Page:
      in: query
      name: page
      description: 页码（从 1 开始）
      schema: { type: integer, minimum: 1, default: 1 }
    Sort:
      in: query
      name: sort
      description: 排序字段白名单，总是附稳定 tie-breaker id
      schema: { type: string, example: '-updatedAt,id' }

  # ─────────────────────────────────────────────
  # 安全方案
  # ─────────────────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth/OIDC access token。
        - Access token 有效期 ≤ 15min
        - Refresh token 有效期 ≤ 7d，rotation 模式
        - 服务间使用 workload identity / mTLS
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: 浏览器持有的 httpOnly + Secure + SameSite=Strict Cookie

  # ─────────────────────────────────────────────
  # 通用响应
  # ─────────────────────────────────────────────
  responses:
    BadRequest:
      description: 请求格式错误或幂等键缺失
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            missingIdempotencyKey:
              value:
                errorCode: IDEMPOTENCY_KEY_REQUIRED
                code: 4001
                status: 400
                title: 缺少幂等键
                detail: 命令型请求必须携带 Idempotency-Key 头
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
    Unauthorized:
      description: 未认证或 Token 无效
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            tokenInvalid:
              value:
                errorCode: AUTHENTICATION_REQUIRED
                code: 4011
                status: 401
                title: 未认证
                detail: Access token 无效或已过期
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
    Forbidden:
      description: 已认证但作用域/政策拒绝
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            accessDenied:
              value:
                errorCode: ACCESS_DENIED
                code: 4031
                status: 403
                title: 无访问权限
                detail: 当前主体对该项目无访问权限
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
            dataResidencyDenied:
              value:
                errorCode: DATA_RESIDENCY_DENIED
                code: 4032
                status: 403
                title: 数据驻留策略拒绝
                detail: 跨境数据访问未通过数据驻留策略
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
    NotFound:
      description: 资源不存在（按防枚举策略隐藏 404/403 一致）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            notFound:
              value:
                errorCode: RESOURCE_NOT_FOUND
                code: 4041
                status: 404
                title: 资源不存在
                detail: 项目不存在或已被归档
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
    Conflict:
      description: 状态/依赖/锁/业务冲突
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            stateConflict:
              value:
                errorCode: STATE_CONFLICT
                code: 4091
                status: 409
                title: 状态冲突
                detail: 资源当前状态不允许此操作
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
            baselineNotFrozen:
              value:
                errorCode: BASELINE_NOT_FROZEN
                code: 4092
                status: 409
                title: 基线未冻结
                detail: 门禁决策只能引用已冻结（frozen）状态的基线
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
    ValidationError:
      description: 语义/字段错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            validationFailed:
              value:
                errorCode: VALIDATION_FAILED
                code: 4221
                status: 422
                title: 字段校验失败
                detail: floorsMin 必须 ≥ 1
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                errors:
                  - code: RANGE_OUT_OF_BOUNDS
                    pointer: /floorsMin
                    parameter: floorsMin
                retryable: false
            idempotencyKeyReused:
              value:
                errorCode: IDEMPOTENCY_KEY_REUSED
                code: 4222
                status: 422
                title: 幂等键重用
                detail: 同 Idempotency-Key 与不同请求指纹
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
    PreconditionFailed:
      description: If-Match 不匹配
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            revisionConflict:
              value:
                errorCode: REVISION_CONFLICT
                code: 4121
                status: 412
                title: 版本冲突
                detail: ETag 不匹配，请刷新后重试
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
    PreconditionRequired:
      description: 缺少 If-Match 前置条件
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            preconditionRequired:
              value:
                errorCode: PRECONDITION_REQUIRED
                code: 4281
                status: 428
                title: 缺少前置条件
                detail: 修改资源必须携带 If-Match 头
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
    PayloadTooLarge:
      description: 请求体过大
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    UnsupportedMediaType:
      description: 媒体类型不支持
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    RateLimited:
      description: 请求频率超限
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
        X-RateLimit-Reset: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
          examples:
            rateLimited:
              value:
                errorCode: RATE_LIMITED
                code: 4291
                status: 429
                title: 请求频率超限
                detail: 单 IP 限速 100 req/s，请稍后重试
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: true
                retryAfter: 30
            budgetExhausted:
              value:
                errorCode: BUDGET_EXHAUSTED
                code: 4292
                status: 429
                title: AI 预算耗尽
                detail: 本月 AI 配额已用完
                correlationId: 0190f8e9-aabb-7c01-2345-6789abcdef03
                retryable: false
    InternalError:
      description: 服务端内部错误（不泄漏实现细节）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    DependencyFailed:
      description: 下游服务失败
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    CapabilityUnavailable:
      description: 能力暂不可用
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    DeadlineExceeded:
      description: 请求超时
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  # ─────────────────────────────────────────────
  # Schema
  # ─────────────────────────────────────────────
  schemas:
    # ── 统一响应 ──
    ApiResponse:
      type: object
      description: |
        统一成功响应。
        权威源：D35.9（HTTP 200 + code === 0 = 成功）
      required: [code, traceId]
      properties:
        code:
          type: integer
          description: 业务码，0 表示成功
          example: 0
        data:
          description: 响应数据（成功时必填）
        message:
          type: string
          description: 可选提示信息
        traceId:
          type: string
          description: 全链路追踪 ID（UUIDv7）

    ApiErrorResponse:
      type: object
      description: |
        RFC 9457 application/problem+json 兼容错误响应。
        扩展字段：errorCode、correlationId、errors、retryable、retryAfter、supportRef
        权威源：D35.9
      required: [errorCode, status, title, detail, correlationId, retryable]
      properties:
        errorCode:
          type: string
          description: 稳定错误码（机器可读，不本地化）
          example: RESOURCE_NOT_FOUND
        code:
          type: integer
          description: 业务码（非 0，与 errorCode 映射）
        status:
          type: integer
          description: HTTP 状态码
          example: 404
        title:
          type: string
          description: 可本地化错误标题
        detail:
          type: string
          description: 可本地化详细描述（不得被客户端用于分支判断）
        correlationId:
          type: string
          description: 关联 ID（同 traceId 语义）
        errors:
          type: array
          description: 字段级错误明细
          items: { $ref: '#/components/schemas/FieldError' }
        retryable:
          type: boolean
          description: 是否可重试（仅 429/502/503/504 可重试）
        retryAfter:
          type: integer
          description: 重试建议秒数
        supportRef:
          type: string
          description: 支持工单引用

    FieldError:
      type: object
      required: [code, pointer, parameter]
      properties:
        code: { type: string, example: REQUIRED }
        pointer:
          type: string
          description: JSON Pointer 指向出错字段
          example: /email
        parameter: { type: string, example: email }
        resourceId: { type: string }

    # ── 分页 ──
    OffsetPage:
      type: object
      description: 偏移分页（适用于小且稳定的管理字典）
      properties:
        items:
          type: array
          items: {}
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }

    CursorPage:
      type: object
      description: |
        游标分页（keyset cursor，适用于资产/Issue/Run 等大规模列表）。
        权威源：D35.6
      properties:
        items:
          type: array
          items: {}
        pageInfo:
          type: object
          properties:
            nextCursor:
              type: string
              nullable: true
            hasNextPage: { type: boolean }

    # ── 业务错误码段常量 ──
    BusinessErrorCode:
      type: string
      description: |
        业务错误码段定义（@design/D35 §D35.9 + api-conventions.md）：
        - 1xxx：IAM 域（认证、主体、租户）
        - 2xxx：Project 域（项目、阶段、门禁、基线）
        - 3xxx：CDE 域（文档、版本、上传）
        - 4xxx：Design 域（设计选项、专业审签）
        - 5xxx：Coordination 域（Findings、BCF、Waiver）
        - 6xxx：Workflow 域（任务、SLA、运营）
        - 7xxx：Compliance 域（规则、Exception、Decide）
        - 9xxx：System（限流、超时、内部错误）
      enum:
        # IAM 1xxx
        - 1001  # INVALID_CREDENTIALS
        - 1002  # TOKEN_EXPIRED
        - 1003  # ACCOUNT_LOCKED
        - 1004  # MFA_REQUIRED
        - 1010  # PRINCIPAL_NOT_FOUND
        - 1011  # PRINCIPAL_DISABLED
        - 1012  # DUPLICATE_EMAIL
        - 1020  # TENANT_SUSPENDED
        # Project 2xxx
        - 2001  # PROJECT_NOT_FOUND
        - 2002  # PROJECT_DUPLICATE_CODE
        - 2010  # STAGE_INVALID_TRANSITION
        - 2020  # GATE_ALREADY_DECIDED
        - 2021  # BASELINE_NOT_FROZEN
        # CDE 3xxx
        - 3001  # DOCUMENT_NOT_FOUND
        - 3002  # DOCUMENT_CHECKED_OUT_BY_OTHER
        - 3010  # VERSION_CONFLICT
        - 3020  # UPLOAD_SESSION_EXPIRED
        - 3021  # UPLOAD_CHECKSUM_MISMATCH
        # Design 4xxx
        - 4001  # DESIGN_OPTION_NOT_FOUND
        - 4010  # SUBMISSION_REQUIRES_REVIEWER
        # Coordination 5xxx
        - 5001  # FINDING_NOT_FOUND
        - 5010  # BCF_INVALID_TOPIC
        # Workflow 6xxx
        - 6001  # TASK_NOT_FOUND
        - 6010  # WORKFLOW_DEADLINE_EXCEEDED
        # Compliance 7xxx
        - 7001  # RULE_NOT_FOUND
        - 7010  # EXCEPTION_REJECTED
        # System 9xxx
        - 9001  # RATE_LIMITED
        - 9002  # BUDGET_EXHAUSTED
        - 9500  # INTERNAL_ERROR
        - 9502  # DEPENDENCY_FAILED
        - 9503  # CAPABILITY_UNAVAILABLE
        - 9504  # DEADLINE_EXCEEDED

    # ── 通用枚举 ──
    DataClassification:
      type: string
      description: 数据分级（security.md §8）
      enum: [public, internal, project_record, sensitive, published_evidence]

    # ── 公共实体 ──
    TenantDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        status:
          type: string
          enum: [active, suspended, terminated]
        region: { type: string }
        language: { type: string }
        classification: { $ref: '#/components/schemas/DataClassification' }
        settings:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer }

    OrganizationDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        type:
          type: string
          enum: [enterprise, department, team, external]
        status:
          type: string
          enum: [active, archived]
        classification: { $ref: '#/components/schemas/DataClassification' }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer }

    RoleBindingDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        roleCode: { type: string }
        scopeType:
          type: string
          enum: [tenant, organization, project]
        scopeId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [active, suspended, expired]
        grantedAt: { type: string, format: date-time }
        grantedBy: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer }

    AccessGrantDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        permission: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, format: uuid, nullable: true }
        effect:
          type: string
          enum: [allow, deny]
        status:
          type: string
          enum: [active, suspended, expired]
        grantedAt: { type: string, format: date-time }
        grantedBy: { type: string, format: uuid }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer }

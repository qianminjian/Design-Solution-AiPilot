server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: core-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # 数据源配置（PostgreSQL 16 + HikariCP）
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:design_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA / Hibernate 配置
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    default-schema: public

  # Jackson JSON 配置
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# 可观测性
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
    build:
      enabled: true

# 应用自定义配置
app:
  name: core-service
  version: @project.version@
  timezone: UTC
  security:
    jwt-secret: ${JWT_SECRET:dev-secret-change-me-in-production-at-least-32-chars}
    access-token-expire: ${JWT_ACCESS_TOKEN_EXPIRES_IN:15m}
    refresh-token-expire: ${JWT_REFRESH_TOKEN_EXPIRES_IN:7d}
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:3000}
  object-storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET_NAME:design-platform}
    region: ${S3_REGION:us-east-1}

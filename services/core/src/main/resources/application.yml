server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: core-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # 数据源配置（PostgreSQL 16 + HikariCP）
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:design_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&stringtype=unspecified
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA / Hibernate 配置
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Hibernate 6 + PostgreSQL: jsonb 列为 String 类型，使用 TEXT JDBC 类型避免类型转换错误
        type:
          preferred_jsonb_jdbc_type: TEXT
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    default-schema: public

  # Jackson JSON 配置
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# 可观测性
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
    build:
      enabled: true

# 应用自定义配置
app:
  name: core-service
  version: @project.version@
  timezone: UTC
  security:
    jwt-secret: ${JWT_SECRET:dev-secret-change-me-in-production-at-least-32-chars}
    access-token-expire: ${JWT_ACCESS_TOKEN_EXPIRES_IN:15m}
    refresh-token-expire: ${JWT_REFRESH_TOKEN_EXPIRES_IN:7d}
    # A-61 P0-2 修复：stepUpToken 哈希盐（对齐 security.md §2.2 密码存储红线）
    # 生产环境必须配置环境变量 STEPUP_TOKEN_SALT（≥32 字符随机字符串），缺失时启动告警但仍可运行（仅开发环境）
    stepup-token-salt: ${STEPUP_TOKEN_SALT:}
    # A-64 Token 自动过期清理任务配置（对齐 security.md §1 密钥 90 天轮换红线）
    # 定时扫描 status='active' 且 expires_at < NOW() 的 Token，批量更新为 status='expired'
    token-cleanup:
      # 调度间隔（秒），默认 1 小时（3600s）
      fixed-delay-seconds: ${TOKEN_CLEANUP_FIXED_DELAY_SECONDS:3600}
      # 应用启动后首次执行延迟（秒），默认 60s（避免启动峰值叠加）
      initial-delay-seconds: ${TOKEN_CLEANUP_INITIAL_DELAY_SECONDS:60}
      # 单批最大处理量，默认 500 条（防止内存峰值）
      batch-size: ${TOKEN_CLEANUP_BATCH_SIZE:500}
    # P0-13.3 测试例外到期自动撤销任务配置（D45.22 验收：Conditional Pass 到期自动撤销）
    # 定时扫描 status=ACTIVE 且 expiry < NOW() 的测试例外，批量更新为 status=EXPIRED
    test-exception-cleanup:
      # 调度间隔（秒），默认 1 小时（3600s）
      fixed-delay-seconds: ${TEST_EXCEPTION_CLEANUP_FIXED_DELAY_SECONDS:3600}
      # 应用启动后首次执行延迟（秒），默认 60s（避免启动峰值叠加）
      initial-delay-seconds: ${TEST_EXCEPTION_CLEANUP_INITIAL_DELAY_SECONDS:60}
      # 单批最大处理量，默认 500 条（防止内存峰值）
      batch-size: ${TEST_EXCEPTION_CLEANUP_BATCH_SIZE:500}
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:3000}
  object-storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET_NAME:design-platform}
    region: ${S3_REGION:us-east-1}
  # Sprint V1.8：AI Service 调用配置（AI 辅助影响分析）
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
    retry-attempts: ${AI_RETRY_ATTEMPTS:1}
  # Sprint V1.10.4：异步线程池配置（A-60 显式 TaskExecutor，对齐 A-59 健康检查异步执行需求）
  # 用于 ConnectorHealthChecker.checkAsync 等 @Async 方法，避免使用 Spring 默认 SimpleAsyncTaskExecutor
  # 默认值适配单机 16GB 内存场景（防 vm-compressor-space-shortage）
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:40}
    thread-name-prefix: ${ASYNC_THREAD_NAME_PREFIX:async-}
    keep-alive-seconds: ${ASYNC_KEEP_ALIVE_SECONDS:60}

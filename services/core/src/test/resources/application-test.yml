server:
  port: 0

spring:
  application:
    name: core-service-test

  # 数据源由 AbstractIntegrationTest 通过 @DynamicPropertySource 注入
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 50
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    default-schema: public

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

app:
  name: core-service-test
  version: test
  timezone: UTC
  security:
    jwt-secret: test-secret-key-at-least-32-characters-long-for-testing
    access-token-expire: 15m
    refresh-token-expire: 7d
  cors:
    allowed-origins: http://localhost:3000
  object-storage:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: design-platform-test
    region: us-east-1
